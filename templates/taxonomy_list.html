{% extends "base.html" %}

{% block title %}{{ taxonomy.name | capitalize }} · {{ config.title }}{% endblock %}

{% block content %}
  <article class="section-page">
    <header class="page-header">
      <h1>{{ taxonomy.name | capitalize }}</h1>
    </header>

    <ul class="taxonomy-terms">
      {% for term in terms %}
        <li>
          <a href="{{ term.permalink | safe }}">{{ term.name }}</a>
          <span class="meta">({{ term.pages | length }})</span>
        </li>
      {% endfor %}
    </ul>
  </article>
{% endblock %}
