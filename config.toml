base_url = "https://zeko.dev"
title = "Zekeriya Koç"
description = "Notes from Zekeriya Koç — software, life, and everything in between."
default_language = "tr"
author = "Zekeriya Koç"

# Generate site-wide and per-section feeds. Feed filename matches what Hugo
# used to emit (index.xml) so existing subscribers keep working.
generate_feeds = true
feed_filenames = ["atom.xml"]

compile_sass = false
build_search_index = false
minify_html = true
generate_sitemap = true
generate_robots_txt = true

taxonomies = [
  { name = "tags", feed = true },
  { name = "categories", feed = true },
]

[markdown]
smart_punctuation = true
external_links_target_blank = true
external_links_no_referrer = true
external_links_no_follow = false
bottom_footnotes = true

[markdown.highlighting]
style = "inline"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
# Used by templates. Edit freely.
accent_light = "#0a7d83"
accent_dark  = "#5eead4"
nav = [
  { name = "Posts", url = "/posts/" },
  { name = "About", url = "/about/" },
  { name = "RSS",   url = "/atom.xml" },
]
